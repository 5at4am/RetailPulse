[server]
# Cached aggregates mean a page change does not need a full reload.
runOnSave = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "full"

[theme]
base = "light"
primaryColor = "#1f6feb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f8fa"
textColor = "#1f2328"