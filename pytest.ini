[pytest]
testpaths = tests
addopts = -ra
markers =
    slow: touches the full 250k-row sales frame or 780k-row panel
filterwarnings =
    error::FutureWarning
    error::DeprecationWarning
    # evidently 0.6+ reaches into numpy.core, which numpy 2.x deprecates. Third-party and
    # out of our control: numpy 2 removed the alias entirely, so there is nothing to upgrade
    # to. Listed explicitly rather than switched off wholesale, so a DeprecationWarning from
    # our own code still fails the suite.
    ignore:The set_bad function will be deprecated.*:
    ignore:.*numpy.core is deprecated.*:DeprecationWarning